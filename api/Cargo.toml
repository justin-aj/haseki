[package]
name = "haseki-api"
version = "0.1.0"
edition = "2024"
default-run = "haseki-api"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.53", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "compression-gzip", "compression-br", "cors"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "time", "json", "migrate", "macros", "derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
utoipa = { version = "6.0.0", features = ["uuid", "time"] }
uuid = { version = "1.28", features = ["v4", "serde"] }
time = { version = "0.3.55", features = ["serde", "serde-well-known", "macros"] }
dotenvy = "0.15.7"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
anyhow = "1.0"
axum-extra = { version = "0.12.6", features = ["cookie"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
reqwest = { version = "0.13.5", features = ["json", "form"] }
argon2 = "0.6.0"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
